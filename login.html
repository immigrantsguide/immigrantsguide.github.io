<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immigrants Guide — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.card{width:min(430px,92%);background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:30px;box-shadow:0 18px 50px #0001}
h1{margin:0 0 8px}.muted{color:#64748b;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:13px;line-height:1.4}.msg.info{display:block;background:#eff6ff;color:#1d4ed8}.msg.ok{display:block;background:#f0fdf4;color:#166534}.msg.err{display:block;background:#fef2f2;color:#991b1b}
.back{display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>Immigrants <span style="color:#2563eb">Guide</span></h1>
<p class="muted">Secure staff login for the USCIS Case Tracker.</p>
<form id="form">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="btn" type="submit">Log In</button>
</form>
<div id="msg" class="msg"></div>
<a class="back" href="index.html">← Back to Case Tracker</a>
</div>
<script>
(function(){
"use strict";
const URL="https://euzifpjzeuqdznkelxdq.supabase.co";
const KEY="sb_publishable_peFBAVgb_bBF0DbZYpBl_A_ZTu8XWVe";
const BOOT="immigrants_guide_auth_bootstrap";
const $=id=>document.getElementById(id);
function message(t,c){$("msg").className="msg "+c;$("msg").textContent=t;}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=$("btn");btn.disabled=true;btn.textContent="Signing in...";
 message("Signing in...","info");
 try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),15000);
   const r=await fetch(URL+"/auth/v1/token?grant_type=password",{
     method:"POST",
     headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+KEY},
     body:JSON.stringify({email:$("email").value.trim(),password:$("password").value}),
     signal:controller.signal
   });
   clearTimeout(timer);
   let data={};try{data=await r.json()}catch(_){}
   if(!r.ok)throw new Error(data.error_description||data.msg||data.message||"Login failed.");
   if(!data.access_token||!data.refresh_token||!data.user)throw new Error("Supabase did not return a complete session.");

   const bootstrap={
     access_token:data.access_token,
     refresh_token:data.refresh_token
   };
   sessionStorage.setItem(BOOT,JSON.stringify(bootstrap));
   // Also keep a fallback in localStorage in case the browser opens dashboard
   // in a separate page context.
   localStorage.setItem(BOOT,JSON.stringify(bootstrap));

   message("Login successful. Opening dashboard...","ok");
   setTimeout(()=>window.location.replace("dashboard.html?auth=1&v="+Date.now()),250);
 }catch(err){
   message(err.name==="AbortError"?"Supabase Auth timed out after 15 seconds.":(err.message||String(err)),"err");
   btn.disabled=false;btn.textContent="Log In";
 }
});
})();
</script>
</body>
</html>
