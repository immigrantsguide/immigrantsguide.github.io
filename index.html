<script>
const SUPABASE_URL="https://euzifpjzeuqdznkelxdq.supabase.co";
const SUPABASE_KEY="sb_publishable_peFBAVgb_bBF0DbZYpBl_A_ZTu8XWVe";

const msg=document.getElementById("msg");
const btn=document.getElementById("loginBtn");

const client=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

function show(text,type="info"){
  msg.className="msg "+type;
  msg.textContent=text;
}

function clear(){
  msg.className="msg";
  msg.textContent="";
}

window.addEventListener("error", e=>{
  show(
    "Website error: "+(e.message||"Unknown JavaScript error"),
    "err"
  );
});

document.getElementById("loginForm").addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    clear();
    btn.disabled=true;
    btn.textContent="Connecting...";

    try{

      const email=document.getElementById("email").value.trim();
      const password=document.getElementById("password").value;

      if(!email || !password){
        throw new Error("Please enter your email and password.");
      }

      show("Connecting to Supabase...","info");

      const {data,error}=await client.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      if(!data.session){
        throw new Error("Login completed but no session was created.");
      }

      show("Login successful. Opening dashboard...","ok");

      setTimeout(()=>{
        window.location.replace("dashboard.html");
      },500);

    }catch(err){

      console.error(err);

      show(
        err && err.message
          ? err.message
          : "Login failed. Please try again.",
        "err"
      );

      btn.disabled=false;
      btn.textContent="Log In";
    }
  }
);
</script>
