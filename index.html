<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Immigrants Guide — USCIS Case Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.card{
  width:min(430px,100%);
  background:#fff;
  padding:34px;
  border:1px solid #e2e8f0;
  border-radius:18px;
  box-shadow:0 15px 40px #0001;
}

.logo{
  font-size:26px;
  font-weight:800;
}

.blue{
  color:#2563eb;
}

.muted{
  color:#64748b;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px #2563eb18;
}

button{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:.65;
  cursor:wait;
}

.msg{
  margin-top:14px;
  padding:11px;
  border-radius:9px;
  font-size:13px;
  line-height:1.45;
  display:none;
}

.err{
  display:block;
  background:#fef2f2;
  color:#991b1b;
  border:1px solid #fecaca;
}

.ok{
  display:block;
  background:#f0fdf4;
  color:#166534;
  border:1px solid #bbf7d0;
}

.info{
  display:block;
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
}
</style>
</head>

<body>

<div class="login">

  <div class="card">

    <div class="logo">
      Immigrants <span class="blue">Guide</span>
    </div>

    <p class="muted">
      USCIS Case Tracker — secure staff login
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button id="loginBtn" type="submit">
        Log In
      </button>

    </form>

    <div id="msg" class="msg"></div>

  </div>

</div>

<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://euzifpjzeuqdznkelxdq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_peFBAVgb_bBF0DbZYpBl_A_ZTu8XWVe";


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const msg = document.getElementById("msg");


/* =========================================================
   CREATE SUPABASE CLIENT
   ========================================================= */

let client = null;

try {

  if (!window.supabase) {
    throw new Error(
      "Supabase library did not load. Please refresh the page."
    );
  }

  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

} catch (error) {

  console.error("Supabase initialization error:", error);

  showMessage(
    "Unable to initialize the login system. Please refresh the page.",
    "err"
  );
}


/* =========================================================
   MESSAGE FUNCTIONS
   ========================================================= */

function showMessage(text, type = "info") {

  msg.className = "msg " + type;
  msg.textContent = text;

}

function clearMessage() {

  msg.className = "msg";
  msg.textContent = "";

}


/* =========================================================
   GLOBAL JAVASCRIPT ERROR HANDLER
   ========================================================= */

window.addEventListener("error", function(event) {

  console.error("Website error:", event.error || event.message);

  if (event.message) {

    showMessage(
      "Website error: " + event.message,
      "err"
    );

  }

});


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  clearMessage();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email) {

    showMessage(
      "Please enter your email address.",
      "err"
    );

    emailInput.focus();

    return;
  }

  if (!password) {

    showMessage(
      "Please enter your password.",
      "err"
    );

    passwordInput.focus();

    return;
  }

  if (!client) {

    showMessage(
      "Login system is not available. Please refresh the page.",
      "err"
    );

    return;
  }


  /* Disable button while authenticating */

  loginBtn.disabled = true;
  loginBtn.textContent = "Connecting...";

  showMessage(
    "Connecting to Supabase...",
    "info"
  );


  try {

    /* =====================================================
       SUPABASE PASSWORD LOGIN
       ===================================================== */

    const { data, error } =
      await client.auth.signInWithPassword({
        email: email,
        password: password
      });


    /* =====================================================
       HANDLE LOGIN ERROR
       ===================================================== */

    if (error) {

      console.error("Supabase login error:", error);

      throw error;

    }


    /* =====================================================
       VERIFY SESSION
       ===================================================== */

    if (!data || !data.session) {

      throw new Error(
        "Login completed, but no active session was created. Please try again."
      );

    }


    /* =====================================================
       LOGIN SUCCESS
       ===================================================== */

    console.log(
      "Login successful:",
      data.user ? data.user.email : email
    );

    showMessage(
      "Login successful. Opening dashboard...",
      "ok"
    );


    /* =====================================================
       REDIRECT TO DASHBOARD
       ===================================================== */

    setTimeout(function() {

      window.location.replace("dashboard.html");

    }, 500);


  } catch (error) {

    console.error("Login failed:", error);

    let errorMessage =
      "Login failed. Please try again.";


    if (error && error.message) {

      errorMessage = error.message;

    }


    /* Common Supabase error message */

    if (
      errorMessage.toLowerCase().includes(
        "invalid login credentials"
      )
    ) {

      errorMessage =
        "Invalid email or password. Please check your credentials and try again.";

    }


    showMessage(
      errorMessage,
      "err"
    );


    /* Re-enable login */

    loginBtn.disabled = false;
    loginBtn.textContent = "Log In";

  }

});

</script>

</body>
</html>
