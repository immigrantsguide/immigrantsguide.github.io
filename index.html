<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immigrants Guide — USCIS Case Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;padding:34px;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 15px 40px #0001}
.logo{font-size:26px;font-weight:800}.blue{color:#2563eb}.muted{color:#64748b}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.msg{margin-top:14px;padding:11px;border-radius:9px;font-size:13px;line-height:1.45;display:none}
.err{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.ok{display:block;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.info{display:block;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
</style>
</head>
<body>
<div class="login">
<div class="card">
<div class="logo">Immigrants <span class="blue">Guide</span></div>
<p class="muted">USCIS Case Tracker — secure staff login</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">Log In</button>
</form>
<div id="msg" class="msg"></div>
</div>
</div>
<script>
const SUPABASE_URL="https://euzifpjzeuqdznkelxdq.supabase.co";
const SUPABASE_KEY="sb_publishable_peFBAVgb_bBF0DbZYpBl_A_ZTu8XWVe";

const msg=document.getElementById("msg");
const btn=document.getElementById("loginBtn");

function show(text,type="info"){
  msg.className="msg "+type;
  msg.textContent=text;
}
function clear(){msg.className="msg";msg.textContent=""}

window.addEventListener("error", e=>{
  show("Website error: "+(e.message||"Unknown JavaScript error"),"err");
});

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  clear();
  btn.disabled=true;
  btn.textContent="Connecting...";
  try{
    if(!window.supabase){
      throw new Error("Supabase library did not load. Please refresh the page.");
    }
    show("Connecting to Supabase...","info");
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;

    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error) throw error;

    show("Login successful. Opening dashboard...","ok");
    sessionStorage.setItem("ig_logged_in","1");
    setTimeout(()=>location.href="dashboard.html",500);
  }catch(err){
    console.error(err);
    show((err && err.message) ? err.message : "Login failed. Please try again.","err");
    btn.disabled=false;
    btn.textContent="Log In";
  }
});
</script>
</body>
</html>
